name: Addon player events verification
on:
  push:
    branches: [codex/addon-player-position-events]
    paths-ignore:
      - docs/**
permissions:
  contents: write
concurrency:
  group: addon-player-events-verification
  cancel-in-progress: true
jobs:
  desktop:
    if: github.repository == 'EzerchE/NuvioDesktop' && github.event.repository.private == false
    runs-on: windows-2022
    timeout-minutes: 40
    env:
      WEBVIEW2_VERSION: 1.0.4078.44
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - name: Fetch public feature commit without credentials
        shell: pwsh
        env:
          GIT_LFS_SKIP_SMUDGE: '1'
          VERIFY_SHA: ${{ github.sha }}
        run: |
          git init .
          git remote add origin https://github.com/EzerchE/NuvioDesktop.git
          git fetch --depth=1 --no-tags origin $env:VERIFY_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Public fetch failed' }
          git checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Feature checkout failed' }
      - name: Fetch only desktop resources and native runtime
        shell: bash
        run: |
          git lfs pull --include="composeApp/src/commonMain/composeResources/**,composeApp/src/desktopMain/native/windows/runtime/**,composeApp/src/desktopMain/native/windows/engine/**" --exclude=""
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Prepare keyless local configuration and WebView2
        shell: pwsh
        run: |
          New-Item -ItemType File local.properties -Force | Out-Null
          nuget install Microsoft.Web.WebView2 -Version $env:WEBVIEW2_VERSION -OutputDirectory "$env:RUNNER_TEMP\nuget" -DirectDownload -NonInteractive -NoCache
          if ($LASTEXITCODE -ne 0) { throw 'WebView2 preparation failed' }
          "WEBVIEW2_ROOT=$env:RUNNER_TEMP\nuget\Microsoft.Web.WebView2.$env:WEBVIEW2_VERSION" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      # The unchanged-base comparison is recorded in run 43011337221. Do not rebuild it on every push.
      - name: Build full Desktop app and run Desktop tests
        shell: pwsh
        run: |
          & .\gradlew.bat :composeApp:desktopJar --no-daemon --no-configuration-cache --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8' '-Pkotlin.daemon.jvmargs=-Xmx6144m' "-Pnuvio.webview2.dir=$env:WEBVIEW2_ROOT"
          if ($LASTEXITCODE -ne 0) { throw 'Feature application compilation failed' }
          & .\gradlew.bat :composeApp:desktopTest --no-daemon --no-configuration-cache --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8' '-Pkotlin.daemon.jvmargs=-Xmx6144m' "-Pnuvio.webview2.dir=$env:WEBVIEW2_ROOT"
          $featureExit = $LASTEXITCODE
          New-Item -ItemType Directory -Force .verification/feature | Out-Null
          Get-ChildItem composeApp/build/test-results -Recurse -Filter 'TEST-*.xml' | Copy-Item -Destination .verification/feature
          "Feature full-suite exit: $featureExit" | Out-File .verification/feature-exit.txt
          if (!(Test-Path composeApp/build/libs)) { throw 'Desktop compile output missing' }
          exit 0
      - name: Package isolated unsigned application for local playback acceptance
        shell: pwsh
        run: |
          & .\gradlew.bat :composeApp:createDistributable --no-daemon --no-configuration-cache --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8' '-Pkotlin.daemon.jvmargs=-Xmx6144m' "-Pnuvio.webview2.dir=$env:WEBVIEW2_ROOT"
          if ($LASTEXITCODE -ne 0) { throw 'Test application packaging failed' }
          $app = Get-ChildItem composeApp/build/compose/binaries/main/app -Directory | Select-Object -First 1
          if (!$app) { throw 'Packaged app directory missing' }
          Compress-Archive -Path $app.FullName -DestinationPath .verification/nuvio-player-events-test.zip
          Get-FileHash .verification/nuvio-player-events-test.zip -Algorithm SHA256 | Format-List | Out-File .verification/SHA256.txt
      - name: Report baseline and feature failures
        if: always()
        shell: pwsh
        run: |
          foreach ($scope in @('baseline','feature')) {
            $totals = @{tests=0;failures=0;errors=0;skipped=0}
            Get-ChildItem ".verification/$scope" -Filter 'TEST-*.xml' -ErrorAction SilentlyContinue | ForEach-Object {
              [xml]$report = Get-Content $_.FullName
              foreach ($metric in @('tests','failures','errors','skipped')) { $totals[$metric] += [int]$report.testsuite.GetAttribute($metric) }
              foreach ($case in $report.testsuite.testcase) {
                foreach ($failure in @($case.failure) + @($case.error)) {
                  if ($failure) { Write-Output "$scope FAILURE $($case.classname) :: $($case.name) :: $($failure.message)" }
                }
              }
            }
            Write-Output "$scope TOTAL $($totals | ConvertTo-Json -Compress)"
          }
      - name: Save only a draft test bundle on own public fork
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: EzerchE/NuvioDesktop
          FEATURE_SHA: ${{ github.sha }}
        shell: pwsh
        run: |
          @('Experimental Desktop player-event build for local validation only.', 'Not an official Nuvio release. Not installed automatically. No personal settings, keys, media or user data included.', "Source: $env:FEATURE_SHA", 'See workflow logs for baseline and full-suite failures; this is not a clean-test release claim.') | Out-File .verification/notes.md -Encoding utf8
          gh release create "notice-validation-$env:GITHUB_RUN_ID" .verification/nuvio-player-events-test.zip .verification/SHA256.txt --target $env:FEATURE_SHA --draft --prerelease --title 'Draft player-event playback validation' --notes-file .verification/notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Draft test bundle export failed' }
      - name: Summarize test evidence without uploading artifacts or caches
        if: always()
        shell: pwsh
        run: |
          '## Desktop verification' | Out-File $env:GITHUB_STEP_SUMMARY -Encoding utf8
          'Standard public-repository Windows runner only. No user secrets, signing, public release publication, Actions artifact upload or cache upload. Own-fork draft test bundle only.' | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          Get-ChildItem composeApp/build/test-results -Recurse -Filter 'TEST-*.xml' -ErrorAction SilentlyContinue | ForEach-Object {
            [xml]$report = Get-Content $_.FullName
            "$($report.testsuite.name): tests=$($report.testsuite.tests), failures=$($report.testsuite.failures), errors=$($report.testsuite.errors)" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }
      - name: Enforce recorded test outcome
        shell: pwsh
        run: |
          if (!(Test-Path .verification/feature-exit.txt)) { throw 'Feature test outcome missing' }
          if ((Get-Content .verification/feature-exit.txt) -notmatch 'exit: 0$') { throw 'Feature desktop suite failed; see retained summary' }
